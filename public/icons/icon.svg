<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="erpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
        </filter>
    </defs>
    
    <!-- Background Rounded Square -->
    <rect width="512" height="512" rx="110" fill="url(#erpGrad)" />
    
    <!-- Inner Glow Ring -->
    <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

    <!-- ERP Monogram / Tech Icon -->
    <g filter="url(#shadow)" fill="#ffffff">
        <!-- Bars of growth -->
        <rect x="110" y="270" width="55" height="130" rx="14" />
        <rect x="195" y="200" width="55" height="200" rx="14" />
        <rect x="280" y="130" width="55" height="270" rx="14" />
        <path d="M 365 140 L 400 175 L 350 200 Z" opacity="0.9" />
        <!-- Trend Arrow -->
        <path d="M 120 230 Q 230 180, 385 100" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
        <polygon points="405,90 365,95 385,130" fill="#ffffff" />
    </g>
</svg>
